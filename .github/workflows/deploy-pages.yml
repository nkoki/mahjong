# main に push するたびに、テストを実行してから Web 版をビルドし、GitHub Pages に公開する。
# 初回だけ、GitHub のリポジトリの Settings → Pages → Build and deployment の Source を
# 「GitHub Actions」にする必要がある。
name: GitHub Pages に公開

on:
  push:
    branches: [main]
  workflow_dispatch: # Actions タブから手動でも実行できる

permissions:
  contents: read
  pages: write
  id-token: write

# 公開の処理が重ならないようにする（途中の公開は止めない）
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    name: テストと Web 版のビルド
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      # 静的解析はリポジトリ全体（点数計算エンジンのテストも含む）を調べるので、
      # 先にアプリとエンジンの両方のパッケージを取得しておく
      - name: パッケージの取得
        run: |
          flutter pub get
          (cd packages/mahjong_score_engine && dart pub get)

      - name: 静的解析
        run: flutter analyze

      - name: アプリのテスト
        run: flutter test

      - name: 点数計算エンジンのテスト
        working-directory: packages/mahjong_score_engine
        run: dart test

      # GitHub Pages の URL は https://<ユーザー名>.github.io/<リポジトリ名>/ なので、
      # ページが読み込むファイルの場所（base href）をリポジトリ名に合わせる。
      # 描画エンジン（CanvasKit）も Google の CDN からではなく GitHub Pages から配信する（--no-web-resources-cdn）
      - name: Web 版のビルド
        run: flutter build web --release --no-web-resources-cdn --base-href "/${{ github.event.repository.name }}/"

      # ビルドした Web 版を実際のブラウザで動かして、主な操作が通るかを確かめる（失敗したら公開しない）
      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Web 版の動作確認（ブラウザ）
        working-directory: e2e
        run: |
          npm ci
          npx playwright install --with-deps chromium
          mkdir -p /tmp/site
          cp -r ../build/web "/tmp/site/${{ github.event.repository.name }}"
          (cd /tmp/site && python3 -m http.server 8765 &)
          sleep 2
          node smoke.mjs "http://localhost:8765/${{ github.event.repository.name }}/"

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: build/web

  deploy:
    name: GitHub Pages に公開
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
